{% extends "layouts/base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-12 px-4 mb-12">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Criar Conta</h2>
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="nome" class="block text-gray-700 font-semibold mb-2">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                
                <div>
                    <label for="cpf" class="block text-gray-700 font-semibold mb-2">CPF</label>
                    <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="data_nascimento" class="block text-gray-700 font-semibold mb-2">Data de Nascimento</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                
                <div>
                    <label for="telefone" class="block text-gray-700 font-semibold mb-2">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            
            <div class="mb-6">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <div class="mb-6">
                <label for="senha" class="block text-gray-700 font-semibold mb-2">Senha</label>
                <input type="password" id="senha" name="senha" required minlength="6"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold">
                Cadastrar
            </button>
        </form>
        
        <p class="mt-6 text-center text-gray-600">
            Já tem uma conta? <a href="{{ url_for('auth.login') }}" class="text-indigo-600 hover:underline">Faça login</a>
        </p>
    </div>
</div>
{% endblock %}
