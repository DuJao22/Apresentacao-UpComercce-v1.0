{% extends "layouts/base.html" %}

{% block title %}Esqueci Minha Senha{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 px-4">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-4">Esqueci Minha Senha</h2>
        <p class="text-center text-gray-600 mb-8">Digite seu email para receber o link de recuperação</p>
        
        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-6">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold">
                Enviar Link de Recuperação
            </button>
        </form>
        
        <p class="mt-6 text-center text-gray-600">
            Lembrou sua senha? <a href="{{ url_for('auth.login') }}" class="text-indigo-600 hover:underline">Faça login</a>
        </p>
    </div>
</div>
{% endblock %}
