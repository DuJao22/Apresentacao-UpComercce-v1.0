{% extends "layouts/base.html" %}

{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 px-4">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Redefinir Senha</h2>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-6">
                <label for="nova_senha" class="block text-gray-700 font-semibold mb-2">Nova Senha</label>
                <input type="password" id="nova_senha" name="nova_senha" required minlength="6"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <div class="mb-6">
                <label for="confirmar_senha" class="block text-gray-700 font-semibold mb-2">Confirmar Nova Senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" required minlength="6"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold">
                Redefinir Senha
            </button>
        </form>
    </div>
</div>
{% endblock %}
