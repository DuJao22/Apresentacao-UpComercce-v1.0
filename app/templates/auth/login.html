{% extends "layouts/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 px-4">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Entrar</h2>
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-6">
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <div class="mb-6">
                <label for="senha" class="block text-gray-700 font-semibold mb-2">Senha</label>
                <input type="password" id="senha" name="senha" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold">
                Entrar
            </button>
        </form>
        
        <p class="mt-4 text-center text-gray-600">
            <a href="{{ url_for('auth.forgot_password') }}" class="text-indigo-600 hover:underline">Esqueci minha senha</a>
        </p>
        
        <p class="mt-2 text-center text-gray-600">
            Não tem uma conta? <a href="{{ url_for('auth.register') }}" class="text-indigo-600 hover:underline">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
